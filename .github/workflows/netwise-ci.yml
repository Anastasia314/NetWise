name: NetWise CI

on:
  push:
    branches: [ main ]
    paths:
      - 'netwise_bot/**'
      - 'main.py'
      - 'requirements.txt'
  pull_request:
    branches: [ main ]
    paths:
      - 'netwise_bot/**'
      - 'main.py'
      - 'requirements.txt'

jobs:
  code-quality:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt